<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0D0F12" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ritm</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
    <!-- Filtro óptico SVG de refração líquida para camadas flutuantes (Liquid Glass) -->
  <svg width="0" height="0" style="position:fixed;pointer-events:none;opacity:0" aria-hidden="true">
    <defs>
      <filter id="ritm-liquid-refraction" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="2" seed="7" result="liquidNoise" />
        <feGaussianBlur in="liquidNoise" stdDeviation="1.8" result="smoothMap" />
        <feDisplacementMap in="SourceGraphic" in2="smoothMap" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="app-shell">
    <nav class="app-nav" aria-label="Navegação Principal">
      <div class="nav-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-title">Ritm</span>
      </div>
      <div class="nav-items" role="tablist">
        <button class="nav-btn active" data-tab="agenda" data-agenda-shortcut="home" role="tab" aria-selected="true" aria-label="Início (Agenda)" title="Início">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9.5"/><path d="M9.5 21v-6a1.5 1.5 0 0 1 1.5-1.5h2a1.5 1.5 0 0 1 1.5 1.5v6"/></svg>
          <span class="nav-desktop-label">Início</span>
        </button>
        <button class="nav-btn" data-tab="agenda" data-agenda-shortcut="month" role="tab" aria-selected="false" aria-label="Visão Mensal" title="Mês">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4.5" width="18" height="16.5" rx="3"/>
            <line x1="16" y1="2.5" x2="16" y2="6.2"/>
            <line x1="8" y1="2.5" x2="8" y2="6.2"/>
            <line x1="3" y1="9.2" x2="21" y2="9.2"/>
            <text id="nav-cal-today-num" x="12" y="17.2" text-anchor="middle" fill="currentColor" stroke="none" font-size="8.2" font-weight="700" font-family="inherit">27</text>
          </svg>
          <span class="nav-desktop-label">Mês</span>
        </button>
        <button class="nav-btn" data-tab="compensations" role="tab" aria-selected="false" aria-label="Compensações" title="Compensações">
          <div class="nav-icon-wrap">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M13 3.2c0-.95 1.12-1.45 1.83-.82l5.72 5.05a1.1 1.1 0 0 1 0 1.64l-5.72 5.05c-.71.63-1.83.13-1.83-.82v-2.45c-4.25.05-7.45 1.38-9.55 4.02-.48.6-1.45.18-1.35-.58C2.95 8.15 7.12 5.75 13 5.55V3.2Z"/>
              <path d="M11 20.8c0 .95-1.12 1.45-1.83.82l-5.72-5.05a1.1 1.1 0 0 1 0-1.64l5.72-5.05c.71-.63 1.83-.13 1.83.82v2.45c4.25-.05 7.45-1.38 9.55-4.02.48-.6 1.45-.18 1.35.58-.85 6.14-5.02 8.54-10.9 8.74v2.35Z"/>
            </svg>
            <span class="nav-badge hidden" id="comp-badge">0</span>
          </div>
          <span class="nav-desktop-label">Compensações</span>
        </button>
        <button class="nav-btn" data-tab="recurrences" role="tab" aria-selected="false" aria-label="Recorrências" title="Recorrências">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span class="nav-desktop-label">Recorrências</span>
        </button>
        <button class="nav-btn" data-tab="settings" role="tab" aria-selected="false" aria-label="Ajustes" title="Ajustes">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="nav-desktop-label">Ajustes</span>
        </button>
      </div>
    </nav>

    <main class="app-main" id="app-main">
      <section id="view-agenda" class="view-section active" aria-label="Agenda"></section>
      <section id="view-compensations" class="view-section hidden" aria-label="Compensações"></section>
      <section id="view-recurrences" class="view-section hidden" aria-label="Recorrências"></section>
      <section id="view-settings" class="view-section hidden" aria-label="Categorias e Ajustes"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modal-backdrop" aria-hidden="true">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Título</h2>
        <button type="button" class="btn-icon" id="modal-close" aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast-stack-host" id="toast-container" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
